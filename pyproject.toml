[project]
name = "greenhouse-monitor"
version = "0.1.0"
description = "Інтелектуальна система моніторингу теплиці"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["greenhouse"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pylint.main]
py-version = "3.11"
ignore = [".venv"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",  # тести та короткі приватні функції
    "missing-class-docstring",
    "too-few-public-methods",
]

[tool.pylint.design]
max-args = 7
max-positional-arguments = 7
max-attributes = 8
max-public-methods = 25
